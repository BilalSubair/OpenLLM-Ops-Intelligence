apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openllm-ops-ingress
  namespace: openllm-ops
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  rules:
    - host: ops-intelligence.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openllm-ops-service
                port:
                  number: 8000
