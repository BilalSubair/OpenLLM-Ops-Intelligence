version: '3.8'

services:
  # --------------------------------------------------
  # OpenLLM Ops Intelligence Backend
  # --------------------------------------------------
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: openllm-ops-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_URL=http://ollama:11434
      - SEARXNG_URL=http://searxng:8080
      - CHROMA_PERSIST_DIR=/app/chroma_db
    shm_size: 16gb
    volumes:
      - backend-data:/app/data
      - chroma-data:/app/chroma_db
    depends_on:
      - ollama
      - searxng
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # --------------------------------------------------
  # Local LLM Inference Engine (Ollama)
  # --------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: openllm-ops-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # --------------------------------------------------
  # Self-Hosted Search Augmentation (SearXNG)
  # --------------------------------------------------
  searxng:
    image: searxng/searxng:latest
    container_name: openllm-ops-searxng
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8082/
    volumes:
      - searxng-data:/etc/searxng

  # --------------------------------------------------
  # Prometheus Telemetry Collector
  # --------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: openllm-ops-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  # --------------------------------------------------
  # Grafana Dashboard Visualization
  # --------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: openllm-ops-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  # --------------------------------------------------
  # Conversational Interface (LibreChat)
  # --------------------------------------------------
  librechat:
    image: ghcr.io/danny-avila/librechat:latest
    container_name: openllm-ops-librechat
    restart: unless-stopped
    ports:
      - "3080:3080"
    environment:
      - HOST=0.0.0.0
      - PORT=3080
      - OPENAI_REVERSE_PROXY=http://backend:8000/api/llm/chat
    depends_on:
      - backend

volumes:
  backend-data:
  chroma-data:
  ollama-models:
  searxng-data:
  prometheus-data:
  grafana-data:
