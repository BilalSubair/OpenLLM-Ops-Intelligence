
services:
  # --------------------------------------------------
  # OpenLLM Ops Intelligence Backend
  # --------------------------------------------------
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: openllm-ops-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_URL=http://ollama:11434
      - SEARXNG_URL=http://searxng:8080
      - CHROMA_PERSIST_DIR=/app/chroma_db
    shm_size: 16gb
    volumes:
      - backend-data:/app/data
      - chroma-data:/app/chroma_db
    depends_on:
      - ollama
      - searxng

  # --------------------------------------------------
  # Local LLM Inference Engine (Ollama)
  # --------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: openllm-ops-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama

  # --------------------------------------------------
  # Self-Hosted Search Augmentation (SearXNG)
  # --------------------------------------------------
  searxng:
    image: searxng/searxng:latest
    container_name: openllm-ops-searxng
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8082/
    volumes:
      - searxng-data:/etc/searxng

  # --------------------------------------------------
  # Prometheus Telemetry Collector
  # --------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: openllm-ops-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  # --------------------------------------------------
  # Grafana Dashboard Visualization
  # --------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: openllm-ops-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  # --------------------------------------------------
  # MongoDB for LibreChat State & User Sessions
  # --------------------------------------------------
  mongodb:
    image: mongo:latest
    container_name: openllm-ops-mongodb
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db

  # --------------------------------------------------
  # Conversational Interface (LibreChat)
  # --------------------------------------------------
  librechat:
    image: ghcr.io/danny-avila/librechat:latest
    container_name: openllm-ops-librechat
    restart: unless-stopped
    ports:
      - "3080:3080"
    environment:
      - HOST=0.0.0.0
      - PORT=3080
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - CONFIG_PATH=/app/librechat.yaml
      - JWT_SECRET=openllm_ops_jwt_secret_token_123456789
      - JWT_REFRESH_SECRET=openllm_ops_jwt_refresh_token_123456789
      - CREDS_KEY=f34be427eff7db32e5faf94f923b7a42
      - CREDS_IV=e921e909e7674251e0ff051f28fb87e2
      - SEARCH=true
      - SEARXNG_INSTANCE_URL=http://searxng:8080
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
      - librechat-data:/app/client/public/images
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mongodb

volumes:
  backend-data:
  chroma-data:
  ollama-models:
  searxng-data:
  prometheus-data:
  grafana-data:
  mongodb-data:
  librechat-data:
