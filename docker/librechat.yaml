# ==============================================================================
# LibreChat Configuration for OpenLLM Ops Intelligence
# Connects LibreChat to backend's /v1 OpenAI-compatible gateway
# ==============================================================================

version: 1.1.5

cache: true

interface:
  privacyPolicy:
    externalUrl: "https://github.com/BilalSubair/OpenLLM-Ops-Intelligence"
    openNewTab: true
  termsOfService:
    externalUrl: "https://github.com/BilalSubair/OpenLLM-Ops-Intelligence"
    openNewTab: true

endpoints:
  custom:
    - name: "OpenLLM Ops Intelligence"
      apiKey: "openllm-ops-internal-key"
      baseURL: "http://host.docker.internal:8001/v1"
      models:
        default:
          - "qwen3.5:2b"
          - "llama-3.2-3b-instruct-q4"
          - "llama-3.1-8b-instruct-q8"
          - "qwen2.5-coder-7b"
          - "mistral-nemo-12b-awq"
        fetch: true
      titleConvo: true
      titleModel: "qwen3.5:2b"
      summarize: false
      summaryModel: "qwen3.5:2b"
      forcePrompt: false
      modelDisplayLabel: "OpenLLM Ops AI"

    - name: "OpenLLM Ops (Docker Network)"
      apiKey: "openllm-ops-internal-key"
      baseURL: "http://backend:8000/v1"
      models:
        default:
          - "qwen3.5:2b"
          - "llama-3.2-3b-instruct-q4"
          - "llama-3.1-8b-instruct-q8"
          - "qwen2.5-coder-7b"
          - "mistral-nemo-12b-awq"
        fetch: true
      titleConvo: true
      titleModel: "qwen3.5:2b"
      summarize: false
      summaryModel: "qwen3.5:2b"
      forcePrompt: false
      modelDisplayLabel: "OpenLLM Ops AI (Docker Network)"
